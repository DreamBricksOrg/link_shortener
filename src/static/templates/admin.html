<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Links Encurtados</title>
  <link rel="stylesheet" href="/src/static/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/src/static/css/dreambricks.css">
</head>
<body>
  <header class="app-header"><a class="app-brand" href="/admin/" aria-label="DreamBricks, painel"><img src="/src/static/design_system/assets/logos/dreambricks-horizontal-onlight.svg" alt="DreamBricks"></a><nav class="nav-bar" aria-label="Navegação principal"><div class="nav-menu"><a href="/admin/dashboard" class="nav-link"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#overview"></use></svg>Visão geral</a><a href="/admin/dash/links" class="nav-link"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#link"></use></svg>Links</a><a href="/admin/dash/logs" class="nav-link"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#activity"></use></svg>Acessos</a><a href="/admin/form/" class="nav-link"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#plus"></use></svg>Novo link</a><a href="/admin/" class="nav-link nav-link-admin active" aria-current="page"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#filter"></use></svg>Admin</a></div></nav></header>
  <h1>Admin de links</h1>

  <div class="controls">
    <button id="shortener-btn" class="button-primary"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#plus"></use></svg> Novo link</button>
    <button id="reload-btn"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#refresh"></use></svg> Recarregar</button>
    <button id="export-btn" hidden><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#download"></use></svg> Exportar CSV</button>
    <button id="links-btn"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#link"></use></svg> Ver dashboard</button>
  </div>

  <div class="filter-toolbar"><h2>Filtros avançados</h2><button id="toggle-filters-btn" type="button" aria-expanded="false" aria-controls="advanced-filters"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#filter"></use></svg> Mostrar filtros</button></div>
  <div class="filter-form" id="advanced-filters" hidden>
    <label>Slug: <input type="text" id="filter-slug"></label>
    <label>Título: <input type="text" id="filter-tittle"></label>
    <label>Notas: <input type="text" id="filter-notes"></label>
    <label>URL Original: <input type="text" id="filter-original"></label>
    <label>Callback URL: <input type="text" id="filter-callback"></label>
    <label>De: <input type="date" id="filter-date-from"></label>
    <label>Até: <input type="date" id="filter-date-to"></label>
    <button id="apply-filters-btn"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#search"></use></svg> Aplicar filtros</button>
    <button id="clear-filters-btn" type="button">Limpar filtros</button>
  </div>

  <div class="view-toolbar" aria-label="Modo de exibição dos links">
    <div class="view-switch" role="group" aria-label="Exibição">
      <button id="grouped-view-btn" type="button" aria-pressed="true">Agrupados</button>
      <button id="individual-view-btn" type="button" aria-pressed="false">Individuais</button>
    </div>
    <p id="view-description">Links com o mesmo endereço base aparecem juntos.</p>
  </div>

  <div id="loading-spinner" class="spinner" style="display: none;"></div>
  <div id="links-container" class="links-grid"></div>

  <div class="pagination" id="pagination" hidden>
    <button id="prev-page-btn" disabled>Anterior</button>
    <span id="page-info">Página 1</span>
    <button id="next-page-btn" disabled>Próxima</button>
  </div>

  <script>
    const adminToken = localStorage.getItem('adminToken');
    if (!adminToken) {
      Swal.fire({
        icon: 'warning',
        title: 'Acesso Negado',
        text: 'Faça login como admin primeiro.',
        confirmButtonText: 'Ir para Login'
      }).then(() => {
        location.href = '/auth/';
      });
    }

    const filters = {
      'filter-slug': 'slug',
      'filter-tittle': 'title',
      'filter-notes': 'notes',
      'filter-original': 'original_url',
      'filter-callback': 'callback_url',
      'filter-date-from': 'date_from',
      'filter-date-to': 'date_to'
    };

    let currentPage = 1;
    const pageSize = 9;
    let groupedView = true;
    let requestSequence = 0;

    function filterParams(page = currentPage, size = pageSize) {
      const params = new URLSearchParams({ page, page_size: size });
      for (const [id, key] of Object.entries(filters)) {
        const value = document.getElementById(id).value;
        if (value) params.append(key, value);
      }
      return params;
    }

    for (const [id, grouped] of [['grouped-view-btn', true], ['individual-view-btn', false]]) {
      document.getElementById(id).addEventListener('click', () => {
        if (groupedView === grouped) return;
        groupedView = grouped;
        currentPage = 1;
        document.getElementById('grouped-view-btn').setAttribute('aria-pressed', String(grouped));
        document.getElementById('individual-view-btn').setAttribute('aria-pressed', String(!grouped));
        document.getElementById('view-description').textContent = grouped
          ? 'Links com o mesmo endereço base aparecem juntos.'
          : 'Todos os links aparecem em cartões separados.';
        loadLinks(false);
      });
    }

    document.getElementById('toggle-filters-btn').addEventListener('click', () => {
      const panel = document.getElementById('advanced-filters');
      panel.hidden = !panel.hidden;
      const toggle = document.getElementById('toggle-filters-btn');
      toggle.setAttribute('aria-expanded', String(!panel.hidden));
      toggle.innerHTML = panel.hidden ? '<svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#filter"></use></svg> Mostrar filtros' : '<svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#filter"></use></svg> Ocultar filtros';
    });
    document.getElementById('clear-filters-btn').addEventListener('click', () => {
      Object.keys(filters).forEach(id => document.getElementById(id).value = '');
      currentPage = 1; loadLinks(false);
    });
    document.querySelectorAll('#advanced-filters input').forEach(input => input.addEventListener('keydown', event => { if (event.key === 'Enter') document.getElementById('apply-filters-btn').click(); }));
    document.getElementById('reload-btn').addEventListener('click', () => {
      currentPage = 1;
      loadLinks(true);
    });
    document.getElementById('apply-filters-btn').addEventListener('click', () => {
      currentPage = 1;
      loadLinks(false);
    });
    document.getElementById('links-btn').addEventListener('click', () => { window.location.href = "/admin/dash/links"; });
    document.getElementById('export-btn').addEventListener('click', () => exportCSV());
    document.getElementById("shortener-btn").addEventListener("click", () => { window.location.href = "/admin/form/";});
    
    document.getElementById('prev-page-btn').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadLinks(false);
      }
    });

    document.getElementById('next-page-btn').addEventListener('click', () => {
      currentPage++;
      loadLinks(false);
    });

    async function loadLinks(showControls) {
      const sequence = ++requestSequence;
      const mode = groupedView;
      const spinner = document.getElementById('loading-spinner');
      const container = document.getElementById('links-container');
      const pagination = document.getElementById('pagination');
      
      spinner.style.display = 'block';
      container.innerHTML = '';
      pagination.hidden = true;

      const params = filterParams();

      try {
        const res = await fetch(`${mode ? '/admin/link-groups' : '/admin/links'}?${params}`, {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });
        if (sequence !== requestSequence) return;

        if (res.status === 401) {
          Swal.fire({
            icon: 'error',
            title: 'Sessão Expirada',
            text: 'Por favor, faça login novamente.'
          }).then(() => location.href = "/auth/");
          return;
        }

        if (!res.ok) throw new Error(`Falha ao buscar links (${res.status})`);

        const json = await res.json();
        if (json.total > 0 && currentPage > 1 && (currentPage - 1) * pageSize >= json.total) {
          currentPage--;
          return loadLinks(showControls);
        }
        const list = json.data || [];
        
        if (mode) renderGroups(list);
        else renderLinks(list);
        updatePagination(json.total || 0);

        if (showControls) {
          document.getElementById('export-btn').hidden = false;
        }
      } catch (error) {
        if (sequence !== requestSequence) return;
        Swal.fire('Erro', 'Falha ao carregar links.', 'error');
        console.error(error);
      } finally {
        if (sequence === requestSequence) spinner.style.display = 'none';
      }
    }

    function updatePagination(total) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      document.getElementById('page-info').textContent = `Página ${currentPage} de ${pages}`;
      document.getElementById('prev-page-btn').disabled = currentPage === 1;
      document.getElementById('next-page-btn').disabled = currentPage >= pages;
      document.getElementById('pagination').hidden = total <= pageSize;
    }

    function renderGroups(groups) {
      const container = document.getElementById('links-container');
      container.replaceChildren();
      if (!groups.length) {
        container.innerHTML = '<p class="links-empty">Nenhum link encontrado.</p>';
        return;
      }
      groups.forEach(group => {
        const details = document.createElement('details');
        details.className = 'link-group';
        const summary = document.createElement('summary');
        const heading = document.createElement('span');
        heading.className = 'link-group-heading';
        const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.setAttribute('class', 'db-icon');
        icon.setAttribute('aria-hidden', 'true');
        const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', '/src/static/images/icons.svg#link');
        icon.appendChild(use);
        const label = document.createElement('span');
        label.className = 'link-group-url';
        label.textContent = group.base_url || 'Sem endereço';
        heading.append(icon, label);
        const count = document.createElement('span');
        count.className = 'link-group-count';
        count.textContent = `${group.count} ${group.count === 1 ? 'link' : 'links'}`;
        summary.append(heading, count);
        const body = document.createElement('div');
        body.className = 'link-group-body';
        body.dataset.page = '0';
        details.append(summary, body);
        details.addEventListener('toggle', () => {
          if (details.open && body.dataset.page === '0') loadGroupLinks(group.base_url, body);
        });
        container.appendChild(details);
      });
    }

    async function loadGroupLinks(baseUrl, body) {
      if (body.hasAttribute('aria-busy')) return;
      const page = Number(body.dataset.page) + 1;
      const params = filterParams(page, pageSize);
      params.set('group_base', baseUrl);
      body.setAttribute('aria-busy', 'true');
      const oldButton = body.querySelector('.group-more');
      if (oldButton) oldButton.remove();
      try {
        const res = await fetch(`/admin/links?${params}`, {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });
        if (!res.ok) throw new Error(`Falha ao carregar grupo (${res.status})`);
        const json = await res.json();
        const grid = body.querySelector('.group-links') || document.createElement('div');
        grid.className = 'group-links';
        if (!grid.isConnected) body.appendChild(grid);
        json.data.forEach(link => grid.appendChild(createLinkCard(link)));
        body.dataset.page = String(page);
        if (page * pageSize < json.total) {
          const more = document.createElement('button');
          more.className = 'group-more';
          more.type = 'button';
          more.textContent = 'Carregar mais links';
          more.addEventListener('click', () => loadGroupLinks(baseUrl, body));
          body.appendChild(more);
        }
      } catch (error) {
        const retry = oldButton || document.createElement('button');
        retry.className = 'group-more';
        retry.type = 'button';
        retry.textContent = 'Tentar carregar novamente';
        if (!oldButton) retry.addEventListener('click', () => loadGroupLinks(baseUrl, body));
        body.appendChild(retry);
        console.error(error);
      } finally {
        body.removeAttribute('aria-busy');
      }
    }

    function renderLinks(list) {
      const c = document.getElementById("links-container");
      c.innerHTML = "";
      
      if (list.length === 0) {
        c.innerHTML = '<p class="links-empty">Nenhum link encontrado.</p>';
        return;
      }

      list.forEach(link => c.appendChild(createLinkCard(link)));
    }

    function createLinkCard(link) {
        const div = document.createElement('div');
        div.className = 'card';
        div.id = `link-${link.id}`;
        div.dataset.originalUrl = link.original_url || '';
        div.innerHTML = `
          <div class="card-header">
            <span class="slug-title">${link.slug}</span>
            <span style="font-size: 0.8rem;">${new Date(link.created_at || Date.now()).toLocaleDateString()}</span>
          </div>
          
          <div class="card-body">
            <label>
              Título
              <input type="text" id="title-${link.id}" value="${link.title || ''}">
            </label>
            <label>
              URL Original
              <input type="text" id="orig-${link.id}" value="${link.original_url || ''}">
            </label>
            <label>
              Notas
              <input type="text" id="notes-${link.id}" value="${link.notes || ''}">
            </label>
            <label>
              Callback URL
              <input type="text" id="cb-${link.id}" value="${link.callback_url || ''}">
            </label>
            
            <div class="qr-container" id="qr-container-${link.id}">
              ${link.qr_png ? `<a id="qr-png-a-${link.id}" href="${link.qr_png}" download target="_blank" title="Baixar PNG">
                <img id="qr-png-img-${link.id}" src="${link.qr_png}" alt="QR PNG">
              </a>` : ''}
              ${link.qr_svg ? `<a id="qr-svg-a-${link.id}" href="${link.qr_svg}" download target="_blank" title="Baixar SVG">
                <img id="qr-svg-img-${link.id}" src="${link.qr_svg}" alt="QR SVG">
              </a>` : ''}
            </div>
          </div>

          <div class="card-footer">
            <button onclick="showAccessLog('${link.slug}')"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#activity"></use></svg> Acessos</button>
            <button onclick="regenerateQr('${link.slug}', '${link.id}')"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#refresh"></use></svg> Regenerar QR</button>
            <div class="card-actions">
              <button onclick="updateLink('${link.id}')"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#save"></use></svg> Salvar</button>
              <button class="btn-delete" onclick="deleteLink('${link.id}')"><svg class="db-icon" aria-hidden="true"><use href="/src/static/images/icons.svg#trash"></use></svg> Excluir</button>
            </div>
            <div class="status" id="status-${link.id}" style="text-align: center; height: 1.2rem;"></div>
          </div>
        `;
        return div;
    }

    async function updateLink(id) {
      const btn = document.querySelector(`#link-${id} button[onclick^="updateLink"]`);
      const originalText = btn.textContent;
      btn.textContent = 'Salvando...';
      btn.disabled = true;

      const params = new URLSearchParams({
        title: document.getElementById(`title-${id}`).value,
        original_url: document.getElementById(`orig-${id}`).value,
        notes: document.getElementById(`notes-${id}`).value,
        callback_url: document.getElementById(`cb-${id}`).value,
      });

      try {
        const res = await fetch(`/admin/links/${id}?${params}`, {
          method: "PATCH",
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });

        const el = document.getElementById(`status-${id}`);
        if (res.ok) {
          el.textContent = "✔️ Atualizado!";
          setTimeout(() => el.textContent = "", 2000);
          if (groupedView && params.get('original_url') !== btn.closest('.card').dataset.originalUrl) {
            loadLinks(false);
          }
        } else {
          el.textContent = "❌ Erro ao atualizar.";
          Swal.fire('Erro', 'Não foi possível atualizar o link.', 'error');
        }
      } catch (err) {
        Swal.fire('Erro', 'Falha na comunicação.', 'error');
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    async function deleteLink(id) {
      const result = await Swal.fire({
        title: 'Tem certeza?',
        text: "Esta ação não pode ser revertida!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
      });

      if (result.isConfirmed) {
        try {
          const res = await fetch(`/admin/links/${id}`, {
            method: "DELETE",
            headers: { 'Authorization': 'Bearer ' + adminToken }
          });

          if (res.ok) {
            loadLinks(false);
            Swal.fire('Excluído!', 'O link foi removido.', 'success');
          } else {
            Swal.fire('Erro', 'Não foi possível excluir o link.', 'error');
          }
        } catch (err) {
          Swal.fire('Erro', 'Falha na comunicação.', 'error');
        }
      }
    }

    async function exportCSV() {
      const params = new URLSearchParams();
      const activeFilters = [];

      for (const [id, key] of Object.entries(filters)) {
        const val = document.getElementById(id).value;
        if (val) {
          params.append(key, val);
          activeFilters.push(`${key}-${val}`);
        }
      }

      try {
        const res = await fetch(`/admin/links/export?${params}`, {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });

        if (!res.ok) throw new Error('Erro ao exportar');

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const date = new Date().toISOString().slice(0, 10);
        const slugPart = activeFilters.length ? activeFilters.join("_") : "all";

        const a = document.createElement("a");
        a.download = `${slugPart}_logs_${date}.csv`;
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        Swal.fire('Erro', 'Não foi possível exportar o CSV.', 'error');
      }
    }

    async function showAccessLog(slug) {
      Swal.fire({
        title: `Logs de acesso: ${slug}`,
        html: '<div class="spinner"></div><p>Carregando logs...</p>',
        showConfirmButton: false,
        width: '800px'
      });

      try {
        const res = await fetch(`/admin/links/${slug}/logs`, {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });

        if (res.status === 401) {
          Swal.fire({
            icon: 'error',
            title: 'Sessão Expirada',
            text: 'Por favor, faça login novamente.'
          }).then(() => location.href = "/auth/");
          return;
        }

        if (res.status === 204) {
          Swal.update({
            html: `
              <p>Nenhum registro de acesso encontrado para este link.</p>
              <div style="margin-top: 20px;">
                <button onclick="window.location.href='/admin/dash/link/${slug}'" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px;">Ver Dashboard Completo</button>
              </div>
            `,
            showConfirmButton: true,
            confirmButtonText: 'Fechar'
          });
          return;
        }

        if (!res.ok) throw new Error('Falha ao buscar logs');

        const logs = await res.json();
        
        let htmlContent = '';
        if (logs.length === 0) {
          htmlContent = '<p>Nenhum registro de acesso encontrado.</p>';
        } else {
          const rows = logs.slice(0, 50).map(log => `
            <tr>
              <td>${new Date(log.timestamp || Date.now()).toLocaleString()}</td>
              <td>${log.ip || '-'}</td>
              <td>${log.browser || '-'}</td>
              <td>${log.os || '-'}</td>
              <td>${log.referer || '-'}</td>
            </tr>
          `).join('');

          htmlContent = `
            <div style="max-height: 400px; overflow-y: auto;">
              <table class="log-table">
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>IP</th>
                    <th>Browser</th>
                    <th>OS</th>
                    <th>Referer</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
            ${logs.length > 50 ? '<p style="margin-top:10px; font-size:0.8rem; color:#666;">Mostrando últimos 50 registros.</p>' : ''}
            <div style="margin-top: 20px;">
              <button onclick="exportSingleLog('${slug}')" style="padding: 8px 16px;">Exportar CSV</button>
              <button onclick="window.location.href='/admin/dash/link/${slug}'" style="padding: 8px 16px; margin-left: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px;">Ver Dashboard Completo</button>
            </div>
          `;
        }

        Swal.update({
          html: htmlContent,
          showConfirmButton: true,
          confirmButtonText: 'Fechar'
        });

      } catch (err) {
        Swal.fire('Erro', 'Não foi possível carregar os logs.', 'error');
      }
    }

    async function exportSingleLog(slug) {
       try {
          const res = await fetch(`/admin/links/${slug}/logs/export`, {
            headers: { 'Authorization': 'Bearer ' + adminToken }
          });

          if (!res.ok) throw new Error('Erro ao exportar');

          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const date = new Date().toISOString().slice(0, 10);
          a.download = `${slug}_logs_${date}.csv`;
          a.href = url;
          a.click();
          URL.revokeObjectURL(url);
        } catch (err) {
          Swal.fire('Erro', 'Não foi possível exportar os logs.', 'error');
        }
    }

    async function regenerateQr(slug, linkId) {
      const result = await Swal.fire({
        title: 'Regenerar QR Codes?',
        html: `
          <p>Slug: <strong>${slug}</strong></p>
          <label style="display:flex; gap:8px; align-items:center; justify-content:center; margin-top:10px;">
            <input id="swal-force" type="checkbox" checked />
            <span>Forçar sobrescrever arquivos existentes</span>
          </label>
        `,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Regenerar',
        cancelButtonText: 'Cancelar',
        preConfirm: () => {
          const force = document.getElementById('swal-force')?.checked ?? true;
          return { force };
        }
      });

      if (!result.isConfirmed) return;

      try {
        const res = await fetch(`/admin/qr/regenerate`, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + adminToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ slug, force: result.value.force })
        });

        if (res.status === 401) {
          Swal.fire({
            icon: 'error',
            title: 'Sessão Expirada',
            text: 'Por favor, faça login novamente.'
          }).then(() => location.href = "/auth/");
          return;
        }

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          Swal.fire('Erro', err.detail || 'Não foi possível regenerar os QR codes.', 'error');
          return;
        }

        const json = await res.json();
        const entry = (json.results || []).find(r => r.slug === slug);

        if (!entry || !entry.ok) {
          Swal.fire('Erro', 'Não foi possível regenerar os QR codes para este link.', 'error');
          return;
        }

        const cacheBust = `v=${Date.now()}`;
        const pngUrl = entry.qr_png ? `${entry.qr_png}${entry.qr_png.includes('?') ? '&' : '?'}${cacheBust}` : null;
        const svgUrl = entry.qr_svg ? `${entry.qr_svg}${entry.qr_svg.includes('?') ? '&' : '?'}${cacheBust}` : null;

        const container = document.getElementById(`qr-container-${linkId}`);
        if (container) {
          if (pngUrl) {
            let a = document.getElementById(`qr-png-a-${linkId}`);
            let img = document.getElementById(`qr-png-img-${linkId}`);
            if (!a || !img) {
              a = document.createElement('a');
              a.id = `qr-png-a-${linkId}`;
              a.download = '';
              a.target = '_blank';
              a.title = 'Baixar PNG';
              img = document.createElement('img');
              img.id = `qr-png-img-${linkId}`;
              img.alt = 'QR PNG';
              a.appendChild(img);
              container.appendChild(a);
            }
            a.href = pngUrl;
            img.src = pngUrl;
          }

          if (svgUrl) {
            let a = document.getElementById(`qr-svg-a-${linkId}`);
            let img = document.getElementById(`qr-svg-img-${linkId}`);
            if (!a || !img) {
              a = document.createElement('a');
              a.id = `qr-svg-a-${linkId}`;
              a.download = '';
              a.target = '_blank';
              a.title = 'Baixar SVG';
              img = document.createElement('img');
              img.id = `qr-svg-img-${linkId}`;
              img.alt = 'QR SVG';
              a.appendChild(img);
              container.appendChild(a);
            }
            a.href = svgUrl;
            img.src = svgUrl;
          }
        }

        Swal.fire('Sucesso', `QR regenerado${entry.reason ? ` (${entry.reason})` : ''}.`, 'success');

      } catch (e) {
        Swal.fire('Erro', 'Falha na comunicação.', 'error');
      }
    }

    loadLinks(true);
  </script>
</body>
</html>
